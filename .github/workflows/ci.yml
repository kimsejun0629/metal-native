name: MetalNative CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          brew install cmake ninja

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 numpy pytest pytest-cov ruff mypy

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPYTHON_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run C++ tests
        working-directory: build
        run: ctest --output-on-failure --parallel $(sysctl -n hw.ncpu)

      - name: Install Python package
        run: pip install -e .

      - name: Run Python tests
        run: |
          pytest tests/python/ -v --cov=metal_native --cov-report=xml --cov-report=term

      - name: Lint check
        run: |
          ./scripts/lint.sh

      - name: Upload coverage
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-metalnative
          fail_ci_if_error: false

  clang-format-check:
    name: Code Format Check
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install clang-format
        run: brew install clang-format

      - name: Check C++ formatting
        run: |
          find src/ include/ tests/ -name "*.h" -o -name "*.cpp" -o -name "*.mm" | \
            xargs clang-format --dry-run --Werror
