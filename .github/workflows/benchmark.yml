name: Nightly Benchmarks

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'CMakeLists.txt'

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0  # Full history for comparison

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          brew install cmake ninja
          python -m pip install --upgrade pip
          pip install pybind11 numpy pytest pandas matplotlib

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPYTHON_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run C++ benchmarks
        working-directory: build
        run: |
          ./benchmarks/benchmark_runner --benchmark_format=json \
            --benchmark_out=benchmark_results.json

      - name: Install Python package
        run: pip install -e .

      - name: Run Python benchmarks
        run: |
          python benchmarks/run_benchmarks.py --output benchmark_python_results.json

      - name: Download previous benchmark results
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: benchmark_cache
          key: benchmark-results-${{ github.ref }}
          restore-keys: |
            benchmark-results-main

      - name: Compare with previous results
        id: compare
        run: |
          python benchmarks/compare_benchmarks.py \
            --current build/benchmark_results.json \
            --previous benchmark_cache/benchmark_results.json \
            --output comparison.md || echo "No previous results found"

      - name: Save current results to cache
        run: |
          mkdir -p benchmark_cache
          cp build/benchmark_results.json benchmark_cache/
          cp benchmark_python_results.json benchmark_cache/

      - name: Post results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            let comparison = 'No comparison available';
            if (fs.existsSync('comparison.md')) {
              comparison = fs.readFileSync('comparison.md', 'utf8');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Benchmark Results\n\n${comparison}`
            });

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            build/benchmark_results.json
            benchmark_python_results.json
            comparison.md
          retention-days: 90

      - name: Check for performance regression
        run: |
          python benchmarks/check_regression.py \
            --current build/benchmark_results.json \
            --previous benchmark_cache/benchmark_results.json \
            --threshold 5.0
