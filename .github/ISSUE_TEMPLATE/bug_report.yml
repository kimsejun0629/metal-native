name: Bug Report
description: Report a bug in MetalNative
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Import metal_native
        2. Create tensor with ...
        3. Run operation ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages/tracebacks)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: macOS Version
      placeholder: "e.g., macOS 14.2 (Sonoma)"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "e.g., MacBook Pro M3 Pro, 18GB"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g., 3.11.7"
    validations:
      required: true

  - type: input
    id: mn-version
    attributes:
      label: MetalNative Version
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
